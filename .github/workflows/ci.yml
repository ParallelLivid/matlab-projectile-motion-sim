name: MATLAB CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on MATLAB R2025b
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b

      - name: Run Code Analyzer
        uses: matlab-actions/run-command@v3
        with:
          command: files = ["projectile_physics.m", "projectile_simulator.m", "examples.m"]; assert(all(arrayfun(@(file) isempty(checkcode(file,"-id")),files)),"MATLAB Code Analyzer reported an issue.")

      - name: Run unit tests
        uses: matlab-actions/run-tests@v3
        with:
          source-folder: .
          select-by-folder: tests
          output-detail: detailed
          test-results-junit: test-results/results.xml
